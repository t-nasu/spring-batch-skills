spring:
  main:
    banner-mode: "off"
    web-application-type: none
  datasource:
    # MySQL が無い環境でも検証できるよう、テストは H2 の MySQL 互換モードで実行する。
    url: jdbc:h2:mem:pointbatch;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  sql:
    init:
      # スキーマは各テストの @Sql で作成するため、自動初期化は行わない。
      mode: never

mybatis:
  mapper-locations: classpath:mybatis/mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true

batch:
  expire-points:
    chunk-size: 1000

logging:
  level:
    root: WARN
    com.example.pointbatch: INFO
